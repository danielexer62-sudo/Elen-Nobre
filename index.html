var lb=document.createElement('div');lb.id='lb';lb.hidden=true;lb.setAttribute('role','dialog');lb.setAttribute('aria-modal','true');lb.setAttribute('aria-label','Galeria de fotos');
lb.innerHTML='<img alt=""><button class="lb-x" type="button" aria-label="Fechar">\u2715</button><button class="lb-p" type="button" aria-label="Foto anterior">\u2190</button><button class="lb-n" type="button" aria-label="Pr\u00f3xima foto">\u2192</button><div class="lb-c"></div>';
document.body.appendChild(lb);
var im=lb.querySelector('img'),ct=lb.querySelector('.lb-c'),list=[],cur=0;
function urls(){return Array.prototype.map.call(document.querySelectorAll('#pv .pv-gal .pv-i'),function(e){var m=/url\(["']?(.*?)["']?\)$/.exec(e.style.backgroundImage||'');return m?m[1]:''}).filter(Boolean)}
function draw(){im.style.animation='none';void im.offsetWidth;im.style.animation='';im.src=list[cur];ct.textContent=(cur+1)+' / '+list.length}
function open(i){list=urls();if(!list.length)return;cur=i;draw();lb.hidden=false;lb.querySelector('.lb-x').focus()}
function close(){lb.hidden=true;im.removeAttribute('src')}
function step(d){cur=(cur+d+list.length)%list.length;draw()}
document.addEventListener('click',function(e){
  if(window.mrEditing)return;var el=e.target.closest&&e.target.closest('#pv .pv-i');if(!el)return;
  var all=Array.prototype.slice.call(document.querySelectorAll('#pv .pv-gal .pv-i'));open(Math.max(0,all.indexOf(el)));
});
lb.addEventListener('click',function(e){if(e.target===lb)close()});
lb.querySelector('.lb-x').onclick=close;lb.querySelector('.lb-p').onclick=function(){step(-1)};lb.querySelector('.lb-n').onclick=function(){step(1)};
window.addEventListener('keydown',function(e){
  if(lb.hidden)return;
  if(e.key==='Escape'){e.stopImmediatePropagation();e.preventDefault();close()}
  else if(e.key==='ArrowRight'){e.preventDefault();step(1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}
},true);
var sx=null;lb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)step(dx<0?1:-1)},{passive:true});
// primeira imagem do slider tambem faz o zoom lento
var s=document.querySelectorAll('.hero .slide')[3];
if(s&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){s.classList.remove('on');setTimeout(function(){s.classList.add('on')},document.getElementById('intro')?4000:80)}
})();
</script>
<script>
(function(){
var fine=matchMedia('(hover:hover) and (pointer:fine)').matches,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce)return;
/* rolagem suave (roda do mouse) */
var S=new WeakMap(); window.mrSyncScroll=function(el){var q=S.get(el);if(q)q.t=el.scrollTop;};
function scroller(t){var o=t.closest&&t.closest('#pv,#ab,#pb');return o||document.scrollingElement}
function tick(el,s,t0){
  var now=performance.now(),dt=Math.min(100,now-(t0||now-16.7)),k=1-Math.pow(1-.14,dt/16.7),diff=s.t-el.scrollTop;
  if(Math.abs(diff)<.6){el.scrollTo({top:s.t,behavior:'instant'});s.run=false;return}
  el.scrollTo({top:el.scrollTop+diff*k,behavior:'instant'});requestAnimationFrame(function(){tick(el,s,now)});
}
window.addEventListener('wheel',function(e){
  if(e.ctrlKey||e.defaultPrevented||Math.abs(e.deltaY)<40||e.deltaX&&Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
  var lb=document.getElementById('lb');if(lb&&!lb.hidden)return;
  if(e.target.closest&&e.target.closest('#ed,textarea'))return;
  var el=scroller(e.target);if(!el)return;
  var s=S.get(el);if(!s){s={t:0,run:false};S.set(el,s)}
  var max=el.scrollHeight-el.clientHeight;if(max<=0)return;
  var base=s.run?s.t:el.scrollTop,dy=e.deltaY*(e.deltaMode===1?32:1);
  e.preventDefault();
  s.t=Math.max(0,Math.min(max,base+dy));
  if(!s.run){s.run=true;requestAnimationFrame(function(){tick(el,s)})}
},{passive:false});
})();
</script>
<script>
(function(){
var hero=document.getElementById('hero'),cores=document.querySelector('.cores');if(!hero)return;
var DARK='#744d3e',LUM={},LT='rgba(255,255,255,.55)',SD='rgba(0,0,0,.32)';
function lin(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)}
function rec(url,cb){
  if(LUM[url]){cb(LUM[url]);return}
  var im=new Image();im.onload=function(){var w=48,hh=Math.max(1,Math.round(48*im.naturalHeight/im.naturalWidth)),c=document.createElement('canvas');c.width=w;c.height=hh;var x=c.getContext('2d');x.drawImage(im,0,0,w,hh);
    var r;try{r={d:x.getImageData(0,0,w,hh).data,w:w,h:hh,ar:im.naturalWidth/im.naturalHeight}}catch(e){return}LUM[url]=r;cb(r)};
  im.src=url}
function zone(r,hw,hh,x0,x1,y0,y1,shade){
  var har=hw/hh,sx0=0,sx1=1,sy0=0,sy1=1,v;
  if(r.ar>har){v=har/r.ar;sx0=(1-v)/2;sx1=sx0+v}else{v=r.ar/har;sy0=(1-v)/2;sy1=sy0+v}
  var ax=sx0+(sx1-sx0)*x0,bx=sx0+(sx1-sx0)*x1,ay=sy0+(sy1-sy0)*y0,by=sy0+(sy1-sy0)*y1,
      px0=Math.max(0,Math.floor(ax*r.w)),px1=Math.min(r.w,Math.ceil(bx*r.w)),py0=Math.max(0,Math.floor(ay*r.h)),py1=Math.min(r.h,Math.ceil(by*r.h)),n=0,sum=0,bright=0;
  for(var y=py0;y<py1;y++)for(var xx=px0;xx<px1;xx++){var k=(y*r.w+xx)*4,L=.2126*lin(r.d[k])+.7152*lin(r.d[k+1])+.0722*lin(r.d[k+2]);sum+=L;if(L*(1-(shade||0))>.25)bright++;n++}
  if(!n)return {avg:.1,f:0};return {avg:sum/n,f:bright/n}}
function logo(d){var s=function(k,v){hero.style.setProperty(k,v)};if(d){s('--li','.346');s('--ls','.805');s('--lsa','2.166');s('--lh','-28.7deg');s('--lb','.816')}else{s('--li','1');s('--ls','0');s('--lsa','1');s('--lh','0deg');s('--lb','1')}}
function adapt(i){
  var el=document.querySelectorAll('.hero .slide')[3+i];if(!el)return;
  var bg=el.style.backgroundImage||el.style.getPropertyValue('--img')||'',m=/url\(["']?(.*?)["']?\)/.exec(bg);
  var set=function(k,v){hero.style.setProperty(k,v)};
  if(!m||el.classList.contains('port')){logo(false);set('--c-nav','#fff');set('--c-bl','#fff');set('--c-br','#fff');set('--c-br-inv',DARK);set('--sc-t','0');set('--sc-b','0');return}
  rec(m[1],function(r){
    var w=hero.clientWidth,h=hero.clientHeight;
    var zl=zone(r,w,h,.06,.34,.05,.15,.24).f,zn=zone(r,w,h,.85,.94,.05,.16,.24).f,
        zb=zone(r,w,h,.06,.32,.72,.94,.25).f,zr=zone(r,w,h,.85,.94,.86,.95,.28).f,T=.62;
    var ft=Math.max(zl,zn),fb=Math.max(zb,zr),sh=function(f){return 'rgba(0,0,0,'+(.25+.45*Math.min(1,f*1.6)).toFixed(2)+')'};
    logo(false);set('--c-nav','#fff');set('--c-bl','#fff');set('--c-br','#fff');set('--c-br-inv',DARK);
    set('--sh-logo',sh(ft));set('--sh-nav',sh(ft));set('--sh-bl',sh(fb));
    set('--sc-t',String(Math.min(.9,ft*1.5)));set('--sc-b',String(Math.min(.95,fb*1.7)));
    if(cores){var a=zone(r,w,h,0,1,0,1,0).avg;cores.style.setProperty('--cs',String(Math.max(.35,Math.min(.62,.35+Math.max(0,a-.12)*.9))))}
  })}
var cur=0,of=window.fbSync;
window.fbSync=function(i){cur=i;if(of)of(i);adapt(i)};
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){adapt(cur)},200)});
adapt(0);
})();
</script>
<script>
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a[href="#contato"]');if(!a)return;
  e.preventDefault();window.mrGoBottom();
  try{history.replaceState(null,'','#contato')}catch(x){}
});
window.mrGoBottom=function(){
  var el=document.scrollingElement||document.documentElement,y0=el.scrollTop,id=(window.mrGoId=(window.mrGoId||0)+1),t0=null;
  function end(){return Math.max(0,el.scrollHeight-el.clientHeight)}
  var d=Math.min(1500,Math.max(700,Math.abs(end()-y0)*.55));if(end()-y0<2)return;
  function set(y){try{el.scrollTo({top:y,behavior:'instant'})}catch(x){el.scrollTop=y}if(window.mrSyncScroll)window.mrSyncScroll(el)}
  function stop(){window.mrGoId++}
  window.addEventListener('touchstart',stop,{passive:true,once:true});
  function st(ts){if(id!==window.mrGoId)return;if(t0===null)t0=ts;var r=Math.min(1,(ts-t0)/d),e=r<.5?4*r*r*r:1-Math.pow(-2*r+2,3)/2;set(y0+(end()-y0)*e);if(r<1)requestAnimationFrame(st);else set(end())}
  requestAnimationFrame(st);
};
</script>
